networks:
    dht-network:
        driver: bridge

volumes:
    test-data1:
    test-data2:
    test-data3:

x-solid-server: &solid-server
    build:
        context: docker
        dockerfile: Dockerfile
    networks:
        - dht-network
    # The server spends ~30s on Components.js discovery and pod seeding before it
    # binds. Without a healthcheck `docker compose up -d --wait` returns as soon as
    # the container is running, so CI started the suite against a socket that was
    # not listening yet and every request failed with "other side closed".
    healthcheck:
        test: ['CMD-SHELL', 'wget -q -O /dev/null "http://localhost:$${PORT}/.account/" || exit 1']
        interval: 5s
        timeout: 5s
        retries: 30
        start_period: 20s

services:
    test-server1:
        <<: *solid-server
        environment:
            - USER_EMAIL=test1@test.com
            - USER_POD=test1
            - USER_PASSWORD=test123
            - BASE_URL=http://localhost:3000
            - PORT=3000
        ports:
            - 3000:3000
        volumes:
            - test-data1:/data
    test-server2:
        <<: *solid-server
        environment:
            - USER_EMAIL=test2@test.com
            - USER_POD=test2
            - USER_PASSWORD=test123
            - BASE_URL=http://localhost:3001
            - PORT=3001
        ports:
            - 3001:3001
        volumes:
            - test-data2:/data
    test-server3:
        <<: *solid-server
        environment:
            - USER_EMAIL=test3@test.com
            - USER_POD=test3
            - USER_PASSWORD=test123
            - BASE_URL=http://localhost:3002
            - PORT=3002
        ports:
            - 3002:3002
        volumes:
            - test-data3:/data
